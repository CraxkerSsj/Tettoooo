
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#13091f">
  <meta name="description" content="Un pequeño universo hecho con cariño.">
  <title>Estrella de Love ✦</title>

  <style>
    :root {
      --bg: #100819;
      --violet: #a875ff;
      --lavender: #d9c0ff;
      --pink: #f17bd5;
      --text: #fff4ff;
      --muted: #c0a9d2;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", "Segoe UI", sans-serif;
    }

    body {
      background:
        radial-gradient(ellipse at 50% 45%, rgba(100, 43, 145, .20), transparent 48%),
        radial-gradient(ellipse at 15% 85%, rgba(187, 65, 163, .10), transparent 35%),
        #100819;
    }

    #space {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(8, 3, 15, .55) 100%);
      z-index: 1;
    }

    .top {
      position: fixed;
      z-index: 2;
      top: clamp(22px, 5vh, 48px);
      left: 20px;
      right: 20px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 0 22px rgba(206, 137, 255, .45);
    }

    .eyebrow {
      margin: 0 0 9px;
      color: #d6b7ff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .34em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(27px, 5vw, 48px);
      font-weight: 500;
      letter-spacing: .025em;
      background: linear-gradient(100deg, #e4d0ff, #f18bdc 55%, #b79aff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 10px 0 0;
      color: rgba(239, 222, 255, .72);
      font-size: 12px;
      letter-spacing: .08em;
    }

    .hint {
      position: fixed;
      z-index: 2;
      left: 50%;
      bottom: 112px;
      transform: translateX(-50%);
      color: rgba(225, 203, 245, .62);
      font-size: 11px;
      letter-spacing: .06em;
      white-space: nowrap;
      pointer-events: none;
    }

    .player {
      position: fixed;
      z-index: 3;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(520px, calc(100% - 30px));
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      gap: 13px;
      padding: 12px 16px;
      border: 1px solid rgba(205, 158, 255, .30);
      border-radius: 20px;
      background: rgba(27, 14, 40, .76);
      box-shadow: 0 0 28px rgba(167, 99, 255, .15), inset 0 1px rgba(255,255,255,.05);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    #play {
      width: 40px;
      height: 40px;
      border: 1px solid rgba(239, 157, 228, .45);
      border-radius: 50%;
      color: white;
      background: linear-gradient(145deg, #a66bfa, #d85bbd);
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(205, 103, 225, .28);
      transition: transform .2s ease, filter .2s ease;
    }

    #play:hover { transform: scale(1.07); filter: brightness(1.12); }

    .track { min-width: 0; }

    .track-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      color: #f5eaff;
      font-size: 11px;
    }

    .track-title span:last-child {
      color: #c7addd;
      font-variant-numeric: tabular-nums;
    }

    .progress {
      height: 5px;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(255,255,255,.13);
      cursor: pointer;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #a875ff, #f17bd5);
      box-shadow: 0 0 12px #d77bfa;
    }

    .volume-label {
      color: #d5b7ef;
      font-size: 10px;
      letter-spacing: .08em;
    }

    .back-link {
      position: fixed;
      z-index: 3;
      top: 18px;
      left: 18px;
      padding: 9px 13px;
      border: 1px solid rgba(205, 158, 255, .25);
      border-radius: 999px;
      color: #e8d7fa;
      background: rgba(29, 15, 43, .55);
      text-decoration: none;
      font-size: 11px;
      backdrop-filter: blur(12px);
      transition: background .2s, border-color .2s;
    }

    .back-link:hover {
      background: rgba(130, 76, 170, .35);
      border-color: rgba(235, 151, 225, .6);
    }

    @media (max-width: 520px) {
      .top { top: 65px; }
      .subtitle { font-size: 10px; }
      .hint { bottom: 108px; font-size: 9px; }
      .player { gap: 10px; padding: 10px 12px; }
      .volume-label { display: none; }
      .back-link { top: 14px; left: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>

<body>
  <canvas id="space" aria-label="Una estrella de neutrones rodeada de palabras en órbita"></canvas>
  <div class="vignette"></div>

  <a class="back-link" href="../index.html">← Volver</a>

  <header class="top">
    <p class="eyebrow">un pequeño universo para ti</p>
    <h1>Estrella de Love</h1>
    <p class="subtitle">Hay cosas que brillan incluso en la inmensidad. ✦</p>
  </header>

  <p class="hint">Arrastra para explorar · Desliza o usa la rueda para acercarte</p>

  <section class="player" aria-label="Reproductor de música">
    <button id="play" type="button" aria-label="Reproducir música">▶</button>
    <div class="track">
      <div class="track-title">
        <span>Una canción para este universo</span>
        <span id="time">0:00 / 0:00</span>
      </div>
      <div class="progress" id="progress" role="slider" aria-label="Progreso de la canción" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
    <span class="volume-label">♫ LOVE</span>
  </section>

  <audio id="audio" src="./music.m4a" preload="metadata" loop></audio>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    (() => {
      const canvas = document.getElementById("space");
      const audio = document.getElementById("audio");
      const playButton = document.getElementById("play");
      const progress = document.getElementById("progress");
      const progressFill = document.getElementById("progressFill");
      const timeLabel = document.getElementById("time");

      // --- Reproductor ---
      const formatTime = (seconds) => {
        if (!Number.isFinite(seconds)) return "0:00";
        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
        return `${minutes}:${secs}`;
      };

      playButton.addEventListener("click", async () => {
        if (audio.paused) {
          try {
            await audio.play();
            playButton.textContent = "Ⅱ";
            playButton.setAttribute("aria-label", "Pausar música");
          } catch (error) {
            console.warn("No se pudo reproducir music.mp3:", error);
            playButton.textContent = "▶";
          }
        } else {
          audio.pause();
          playButton.textContent = "▶";
          playButton.setAttribute("aria-label", "Reproducir música");
        }
      });

      audio.addEventListener("pause", () => {
        playButton.textContent = "▶";
        playButton.setAttribute("aria-label", "Reproducir música");
      });

      audio.addEventListener("play", () => {
        playButton.textContent = "Ⅱ";
        playButton.setAttribute("aria-label", "Pausar música");
      });

      audio.addEventListener("timeupdate", () => {
        const ratio = audio.duration ? audio.currentTime / audio.duration : 0;
        progressFill.style.width = `${ratio * 100}%`;
        progress.setAttribute("aria-valuenow", String(Math.round(ratio * 100)));
        timeLabel.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
      });

      const seek = (clientX) => {
        if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
        const rect = progress.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        audio.currentTime = ratio * audio.duration;
      };

      progress.addEventListener("click", (event) => seek(event.clientX));
      progress.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" && Number.isFinite(audio.duration)) {
          audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
        }
        if (event.key === "ArrowLeft" && Number.isFinite(audio.duration)) {
          audio.currentTime = Math.max(0, audio.currentTime - 5);
        }
      });

      // --- Escena 3D ---
      if (!window.THREE) {
        document.body.insertAdjacentHTML("beforeend",
          '<p style="position:fixed;z-index:9;top:50%;left:20px;right:20px;text-align:center;color:white">No se pudo cargar Three.js. Comprueba tu conexión a internet.</p>');
        return;
      }

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.7));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 3000);
      camera.position.set(0, 105, 410);

      const universe = new THREE.Group();
      scene.add(universe);

      scene.add(new THREE.AmbientLight(0x9874c9, 0.65));

      const violetLight = new THREE.PointLight(0xb77aff, 3.2, 650);
      violetLight.position.set(-130, 100, 150);
      scene.add(violetLight);

      const pinkLight = new THREE.PointLight(0xff75d6, 2.5, 600);
      pinkLight.position.set(150, -80, -100);
      scene.add(pinkLight);

      // Textura procedural de la estrella: no necesita imágenes externas.
      function makeStarTexture() {
        const c = document.createElement("canvas");
        c.width = c.height = 512;
        const ctx = c.getContext("2d");

        const gradient = ctx.createRadialGradient(220, 180, 12, 256, 256, 260);
        gradient.addColorStop(0, "#fff5ff");
        gradient.addColorStop(0.12, "#f5caff");
        gradient.addColorStop(0.34, "#d78bff");
        gradient.addColorStop(0.62, "#8d50d7");
        gradient.addColorStop(0.85, "#44206e");
        gradient.addColorStop(1, "#170b2c");

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 512, 512);

        for (let i = 0; i < 950; i++) {
          const x = Math.random() * 512;
          const y = Math.random() * 512;
          const radius = Math.random() * 2.2;
          ctx.fillStyle = Math.random() > 0.5
            ? "rgba(255,220,255,.22)"
            : "rgba(111,58,180,.25)";
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
        }

        return new THREE.CanvasTexture(c);
      }

      const star = new THREE.Mesh(
        new THREE.SphereGeometry(35, 72, 72),
        new THREE.MeshStandardMaterial({
          map: makeStarTexture(),
          color: 0xffffff,
          emissive: 0x8b38d5,
          emissiveIntensity: 0.8,
          roughness: 0.3,
          metalness: 0.12
        })
      );
      universe.add(star);

      // Corona luminosa alrededor de la estrella.
      function makeGlowTexture() {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const ctx = c.getContext("2d");
        const g = ctx.createRadialGradient(128, 128, 5, 128, 128, 128);
        g.addColorStop(0, "rgba(255,225,255,.75)");
        g.addColorStop(0.18, "rgba(218,126,255,.40)");
        g.addColorStop(0.48, "rgba(160,75,255,.14)");
        g.addColorStop(1, "rgba(160,75,255,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 256, 256);
        return new THREE.CanvasTexture(c);
      }

      const corona = new THREE.Sprite(new THREE.SpriteMaterial({
        map: makeGlowTexture(),
        color: 0xe3a5ff,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      }));
      corona.scale.set(145, 145, 1);
      universe.add(corona);

      // Haces polares estilizados de un púlsar.
      function makeBeam(rotationZ, color) {
        const beam = new THREE.Mesh(
          new THREE.ConeGeometry(13, 155, 32, 1, true),
          new THREE.MeshBasicMaterial({
            color,
            transparent: true,
            opacity: 0.19,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          })
        );
        beam.position.y = 104;
        beam.rotation.z = Math.PI;
        beam.rotation.y = rotationZ;
        universe.add(beam);
        return beam;
      }

      const beamTop = makeBeam(0.15, 0xb77aff);
      const beamBottom = makeBeam(Math.PI, 0xf17bd5);
      beamBottom.position.y = -104;
      beamBottom.rotation.x = Math.PI;

      // Anillos orbitales.
      const orbitMaterials = [
        new THREE.MeshBasicMaterial({ color: 0xb77aff, transparent: true, opacity: 0.48, side: THREE.DoubleSide }),
        new THREE.MeshBasicMaterial({ color: 0xf17bd5, transparent: true, opacity: 0.30, side: THREE.DoubleSide }),
        new THREE.MeshBasicMaterial({ color: 0x8f6bff, transparent: true, opacity: 0.24, side: THREE.DoubleSide })
      ];

      const orbitRadii = [91, 137, 184];
      const orbitRings = orbitRadii.map((radius, index) => {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(radius, radius + 0.65, 180),
          orbitMaterials[index]
        );
        ring.rotation.x = Math.PI / 2 + (index - 1) * 0.12;
        ring.rotation.y = (index - 1) * 0.18;
        universe.add(ring);
        return ring;
      });

      // Campo magnético: curvas finas que rodean la estrella.
      const fieldMaterial = new THREE.LineBasicMaterial({
        color: 0xc49aff,
        transparent: true,
        opacity: 0.25
      });

      for (let i = 0; i < 5; i++) {
        const points = [];
        for (let j = 0; j <= 100; j++) {
          const t = (j / 100) * Math.PI * 2;
          const radius = 48 + i * 5 + Math.sin(t * 2) * 7;
          points.push(new THREE.Vector3(
            Math.cos(t) * radius,
            Math.sin(t * 2) * (17 + i * 2),
            Math.sin(t) * radius * 0.55
          ));
        }
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        universe.add(new THREE.Line(geometry, fieldMaterial));
      }

      // Campo de estrellas. Se limita la cantidad para cuidar el rendimiento.
      const starCount = window.innerWidth < 600 ? 1100 : 1900;
      const positions = new Float32Array(starCount * 3);
      const sizes = new Float32Array(starCount);

      for (let i = 0; i < starCount; i++) {
        const radius = 280 + Math.random() * 1050;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = radius * Math.cos(phi);
        positions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
        sizes[i] = 0.7 + Math.random() * 1.3;
      }

      const starGeometry = new THREE.BufferGeometry();
      starGeometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      starGeometry.setAttribute("size", new THREE.BufferAttribute(sizes, 1));

      const starField = new THREE.Points(
        starGeometry,
        new THREE.PointsMaterial({
          color: 0xe9d7ff,
          size: 1.45,
          transparent: true,
          opacity: 0.85,
          sizeAttenuation: true,
          depthWrite: false
        })
      );
      scene.add(starField);

      // Palabras distribuidas en tres órbitas.
      const words = [
        "Te quiero", "Mi universo", "Dulzura", "Brillas",
        "Mi estrella", "Cariño", "Siempre", "Magia",
        "Tu sonrisa", "Mi lugar feliz", "Un abrazo", "Especial",
        "Bonito", "Mi constelación", "Ternura", "Contigo",
        "Mi persona favorita", "Luz", "Alegría", "♡"
      ];

      function makeWordSprite(text, color) {
        const c = document.createElement("canvas");
        c.width = 512;
        c.height = 112;
        const ctx = c.getContext("2d");

        ctx.font = "600 43px 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = color;
        ctx.shadowBlur = 22;
        ctx.fillStyle = color;
        ctx.fillText(text, 256, 56);

        const texture = new THREE.CanvasTexture(c);
        texture.colorSpace = THREE.SRGBColorSpace;

        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          depthWrite: false
        }));

        sprite.scale.set(text.length > 15 ? 68 : 55, 12, 1);
        return sprite;
      }

      const orbitGroup = new THREE.Group();
      universe.add(orbitGroup);

      const wordColors = ["#e5caff", "#f49be1", "#bd9aff", "#ffffff"];
      const orbitSettings = [
        { radius: 105, tilt: 0.20, speed: 0.20 },
        { radius: 151, tilt: -0.27, speed: -0.13 },
        { radius: 202, tilt: 0.34, speed: 0.085 }
      ];

      const orbitItems = words.map((word, index) => {
        const orbitIndex = index % orbitSettings.length;
        const settings = orbitSettings[orbitIndex];
        const sprite = makeWordSprite(word, wordColors[index % wordColors.length]);
        orbitGroup.add(sprite);

        return {
          sprite,
          radius: settings.radius,
          tilt: settings.tilt,
          speed: settings.speed * (index % 2 ? 1 : 0.82),
          angle: (index / words.length) * Math.PI * 2 * 3 + Math.random() * 0.5,
          phase: Math.random() * Math.PI * 2
        };
      });

      // Controles: arrastrar para girar y rueda/pellizco para zoom.
      let dragging = false;
      let previousX = 0;
      let previousY = 0;
      let rotationX = -0.18;
      let rotationY = 0;
      let targetDistance = 440;
      let currentDistance = 440;
      let pinchDistance = 0;

      canvas.addEventListener("pointerdown", (event) => {
        dragging = true;
        previousX = event.clientX;
        previousY = event.clientY;
        canvas.setPointerCapture(event.pointerId);
      });

      canvas.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        const dx = event.clientX - previousX;
        const dy = event.clientY - previousY;
        rotationY += dx * 0.005;
        rotationX += dy * 0.004;
        rotationX = Math.max(-1.05, Math.min(1.05, rotationX));
        previousX = event.clientX;
        previousY = event.clientY;
      });

      const stopDragging = () => { dragging = false; };
      canvas.addEventListener("pointerup", stopDragging);
      canvas.addEventListener("pointercancel", stopDragging);

      canvas.addEventListener("wheel", (event) => {
        targetDistance += event.deltaY * 0.35;
        targetDistance = Math.max(260, Math.min(720, targetDistance));
      }, { passive: true });

      canvas.addEventListener("touchmove", (event) => {
        if (event.touches.length !== 2) return;
        event.preventDefault();
        const dx = event.touches[0].clientX - event.touches[1].clientX;
        const dy = event.touches[0].clientY - event.touches[1].clientY;
        const nextDistance = Math.hypot(dx, dy);
        if (pinchDistance) {
          targetDistance += (pinchDistance - nextDistance) * 0.7;
          targetDistance = Math.max(260, Math.min(720, targetDistance));
        }
        pinchDistance = nextDistance;
      }, { passive: false });

      canvas.addEventListener("touchend", () => { pinchDistance = 0; }, { passive: true });

      // Animación.
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const elapsed = clock.getElapsedTime();

        star.rotation.y += 0.0018;
        star.rotation.x = Math.sin(elapsed * 0.22) * 0.08;

        const pulse = 1 + Math.sin(elapsed * 2.2) * 0.045;
        star.scale.setScalar(pulse);
        corona.scale.setScalar(145 * (1 + Math.sin(elapsed * 2.2) * 0.07));

        beamTop.rotation.z = Math.PI + Math.sin(elapsed * 0.45) * 0.10;
        beamBottom.rotation.z = Math.sin(elapsed * 0.45) * 0.10;

        orbitRings.forEach((ring, index) => {
          ring.rotation.z += (index % 2 ? -1 : 1) * 0.0008;
        });

        orbitItems.forEach((item) => {
          item.angle += item.speed * 0.001;
          const x = Math.cos(item.angle) * item.radius;
          const z = Math.sin(item.angle) * item.radius;
          const y = Math.sin(item.angle + item.phase) * 13 + Math.sin(item.tilt) * z * 0.22;

          item.sprite.position.set(x, y, z);
          item.sprite.material.opacity = 0.68 + (Math.sin(elapsed * 1.4 + item.phase) + 1) * 0.15;
        });

        starField.rotation.y -= 0.00008;
        universe.rotation.x += (rotationX - universe.rotation.x) * 0.035;
        universe.rotation.y += (rotationY - universe.rotation.y) * 0.035;

        currentDistance += (targetDistance - currentDistance) * 0.06;
        camera.position.set(0, currentDistance * 0.24, currentDistance);
        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.7));
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();
  </script>
</body>
</html>
